name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t ${{ secrets.DOCKERHUB_USER }}/mon-app:${{ github.sha }} ./app

      - name: Tests (exemple simple)
        run: |
          docker run -d -p 5000:5000 --name test-container ${{ secrets.DOCKERHUB_USER }}/mon-app:${{ github.sha }}
          sleep 3
          curl -f http://localhost:5000 || (docker logs test-container && exit 1)
          docker stop test-container

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image
        run: docker push ${{ secrets.DOCKERHUB_USER }}/mon-app:${{ github.sha }}

      - name: Mettre à jour le manifest GitOps
        run: |
          sed -i "s|image: .*mon-app:.*|image: ${{ secrets.DOCKERHUB_USER }}/mon-app:${{ github.sha }}|" k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy: image ${{ github.sha }}"
          git push
