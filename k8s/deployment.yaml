
apiVersion: apps/v1

kind: Deployment

metadata:

  name: mon-app

  namespace: default

spec:

  replicas: 2

  selector:

    matchLabels:

      app: mon-app

  template:

    metadata:

      labels:

        app: mon-app

    spec:

      containers:

      - name: mon-app

        image: galass763/mon-app:4623cc6448bac8b6232b158d85a782b779be00b1

        ports:

        - containerPort: 5000

---

apiVersion: v1

kind: Service

metadata:

  name: mon-app-svc

  namespace: default

spec:

  type: NodePort

  selector:

    app: mon-app

  ports:

  - port: 5000

    targetPort: 5000

    nodePort: 30500

